name: CI

# Lo determinista (compilar, tests JUnit, reglas de ArchUnit, reglas del dominio) lo hace el CI,
# no el agente. Se ejecuta en las ramas de fase y en sus PR; master está congelada.
on:
  push:
    branches: [Monolithic, Hexagonal]
  pull_request:
    branches: [Monolithic, Hexagonal]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # para comparar la PR con su rama base

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Estado del proyecto actualizado (PR que cierra una issue)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only "origin/$BASE_REF...HEAD" | node scripts/check-project-status.mjs -

      - name: Reglas del dominio (Lombok / Immutables / dependencias)
        run: node .claude/skills/ddd-building-block/scripts/check-domain.mjs

      - name: Build y tests (JUnit + ArchUnit)
        run: ./mvnw -B verify

      - name: Aviso por Telegram si falla
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          node scripts/notify.mjs
          "❌ CI fallida en ${{ github.repository }} (${{ github.ref_name }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
