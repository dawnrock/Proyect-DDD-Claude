name: CI

# Lo determinista (compilar, tests JUnit, reglas de ArchUnit, que incluyen las del dominio) lo hace el CI,
# no el agente. Se ejecuta en las ramas de fase y en sus PR; master está congelada.
on:
  push:
    branches: [Monolithic, Hexagonal]
  pull_request:
    branches: [Monolithic, Hexagonal]

jobs:
  # Revisión de dependencias (#204, OWASP A06): falla si la PR añade o sube una dependencia (Maven, acciones) con una
  # vulnerabilidad conocida de severidad alta o crítica. Usa el grafo de dependencias de GitHub (repositorio público).
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias con vulnerabilidades conocidas
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # para comparar la PR con su rama base

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Estado del proyecto actualizado (PR que cierra una issue)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        run: git diff --name-only "origin/$BASE_REF...HEAD" | node scripts/check-project-status.mjs -

      - name: Tests de los scripts (node:test)
        run: node --test "scripts/*.test.mjs"

      - name: Contrato OpenAPI (Redocly)
        run: npx --yes @redocly/cli@2.71.0 lint docs/api/openapi.yaml

      # Versionado del contrato (#112, ADR 0014): si cambia, sube info.version; si es incompatible, la mayor.
      - uses: actions/setup-go@v7
        if: github.event_name == 'pull_request'
        with:
          go-version: '1.27'
          cache: false

      - name: Versión del contrato (oasdiff)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          go install github.com/oasdiff/oasdiff@v1.35.0
          OASDIFF="$(go env GOPATH)/bin/oasdiff" node scripts/check-contract-version.mjs

      - name: Build y tests (JUnit + ArchUnit)
        run: ./mvnw -B verify

      # Pruebas de contrato (#107, ADR 0013): la API real, con el perfil demo, frente a docs/api/openapi.yaml.
      - name: Instalar Schemathesis
        run: pip install schemathesis==4.33.4

      - name: Contrato frente a la implementación (Schemathesis)
        run: node scripts/contract-test.mjs

      - name: Aviso por Telegram si falla
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >
          node scripts/notify.mjs
          "❌ CI fallida en ${{ github.repository }} (${{ github.ref_name }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
