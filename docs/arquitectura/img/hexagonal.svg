<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Hexagonal architecture of phase 2</title>
  <defs>
    <marker id="arrow-in" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrow-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Own background so it reads the same in light and dark themes -->
  <rect x="0" y="0" width="1000" height="640" rx="16" fill="#ffffff"/>

  <!-- Side headers -->
  <text x="130" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">Input side</text>
  <text x="130" y="158" text-anchor="middle" font-size="12" fill="#4b5563">driving · they use the ports</text>
  <text x="870" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#374151">Output side</text>
  <text x="870" y="158" text-anchor="middle" font-size="12" fill="#4b5563">driven · they implement the ports</text>

  <!-- Outer hexagon: application -->
  <polygon points="690,300 595,464.5 405,464.5 310,300 405,135.5 595,135.5" fill="#ffffff" stroke="#374151" stroke-width="3"/>
  <text x="500" y="168" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Application</text>
  <text x="500" y="187" text-anchor="middle" font-size="12" fill="#111827">application · use cases · listener</text>
  <text x="500" y="420" text-anchor="middle" font-size="11" fill="#111827">input ports: Commands / Queries</text>
  <text x="500" y="436" text-anchor="middle" font-size="11" fill="#111827">(output ports live in domain.model)</text>

  <!-- Inner hexagon: domain -->
  <polygon points="600,300 550,386.6 450,386.6 400,300 450,213.4 550,213.4" fill="#f3f4f6" stroke="#374151" stroke-width="3"/>
  <text x="500" y="268" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Domain</text>
  <text x="500" y="292" text-anchor="middle" font-size="12" fill="#111827">domain.model</text>
  <text x="500" y="309" text-anchor="middle" font-size="11" fill="#111827">aggregates · VOs · events</text>
  <text x="500" y="326" text-anchor="middle" font-size="11" fill="#111827">+ output ports</text>
  <text x="500" y="350" text-anchor="middle" font-size="12" fill="#111827">domain.service</text>

  <!-- Input adapters -->
  <g font-size="12" fill="#111827">
    <rect x="20" y="183" width="220" height="64" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="130" y="210" text-anchor="middle" font-size="14" font-weight="700">REST</text>
    <text x="130" y="230" text-anchor="middle" fill="#4b5563">adapter.in.rest</text>

    <rect x="20" y="268" width="220" height="64" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="130" y="295" text-anchor="middle" font-size="14" font-weight="700">Web (Thymeleaf)</text>
    <text x="130" y="315" text-anchor="middle" fill="#4b5563">adapter.in.web</text>

    <rect x="20" y="353" width="220" height="64" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="130" y="380" text-anchor="middle" font-size="14" font-weight="700">Command line</text>
    <text x="130" y="400" text-anchor="middle" fill="#4b5563">adapter.in.cli</text>
  </g>

  <!-- Input arrows: the adapter uses the port -->
  <g stroke="#374151" stroke-width="2.5" fill="none">
    <line x1="242" y1="215" x2="350" y2="215" marker-end="url(#arrow-in)"/>
    <line x1="242" y1="300" x2="300" y2="300" marker-end="url(#arrow-in)"/>
    <line x1="242" y1="385" x2="350" y2="385" marker-end="url(#arrow-in)"/>
  </g>
  <g fill="#374151">
    <circle cx="359" cy="215" r="7"/>
    <circle cx="310" cy="300" r="7"/>
    <circle cx="359" cy="385" r="7"/>
  </g>
  <g font-size="10.5" fill="#374151" text-anchor="middle">
    <text x="292" y="207">Commands / Queries</text>
    <text x="266" y="292">uses</text>
    <text x="292" y="377">Commands / Queries</text>
  </g>

  <!-- Output adapters -->
  <g font-size="12" fill="#111827">
    <rect x="760" y="183" width="220" height="64" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="870" y="210" text-anchor="middle" font-size="14" font-weight="700">Persistence (in memory)</text>
    <text x="870" y="230" text-anchor="middle" fill="#4b5563">adapter.out.persistence</text>

    <rect x="760" y="268" width="220" height="64" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="870" y="295" text-anchor="middle" font-size="14" font-weight="700">Events (Spring)</text>
    <text x="870" y="315" text-anchor="middle" fill="#4b5563">adapter.out.event</text>

    <rect x="760" y="353" width="220" height="64" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <text x="870" y="380" text-anchor="middle" font-size="14" font-weight="700">Tax agency (simulated)</text>
    <text x="870" y="400" text-anchor="middle" fill="#4b5563">adapter.out.taxagency</text>
  </g>

  <!-- Output arrows: the adapter implements the port (dependency points inwards) -->
  <g stroke="#374151" stroke-width="2.5" stroke-dasharray="7 5" fill="none">
    <line x1="758" y1="215" x2="650" y2="215" marker-end="url(#arrow-out)"/>
    <line x1="758" y1="300" x2="700" y2="300" marker-end="url(#arrow-out)"/>
    <line x1="758" y1="385" x2="650" y2="385" marker-end="url(#arrow-out)"/>
  </g>
  <g fill="#374151">
    <circle cx="641" cy="215" r="7"/>
    <circle cx="690" cy="300" r="7"/>
    <circle cx="641" cy="385" r="7"/>
  </g>
  <g font-size="10.5" fill="#374151" text-anchor="middle">
    <text x="708" y="207">AccountRepository</text>
    <text x="721" y="291">EventPublisher</text>
    <text x="708" y="377">IncomeVerifier</text>
  </g>

  <!-- Configuration -->
  <rect x="300" y="500" width="400" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="500" y="522" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">config · DomainConfiguration</text>
  <text x="500" y="541" text-anchor="middle" font-size="11.5" fill="#4b5563">builds the core and connects each port to its adapter</text>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <line x1="60" y1="597" x2="110" y2="597" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow-in)"/>
    <text x="120" y="601">uses the input port</text>
    <line x1="320" y1="597" x2="370" y2="597" stroke="#374151" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-out)"/>
    <text x="380" y="601">implements the output port</text>
    <text x="940" y="601" text-anchor="end" font-weight="700">Every dependency points into the hexagon</text>
  </g>
</svg>
