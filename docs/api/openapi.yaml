openapi: 3.1.0
info:
  title: Proyect-DDD-Claude · Checking accounts API
  version: 0.1.0
  description: |
    REST API of the project (the same in both phases: in phase 1 it lives in `presentation.rest`,
    in phase 2 in the `adapter.in.rest` input adapter). Hand-written contract: each feature adds
    its operations here (see `docs/contracts/`). It follows the style guide in
    `docs/api/style-guide.md`, checked by `redocly.yaml`.

    Errors of this API's operations use the `ProblemDetail` format (RFC 9457) and are translated
    in a single place (`RestExceptionHandler`). A path that does not exist (`/api/...` with no
    operation) is answered by Spring Boot with its standard JSON error, not with `ProblemDetail`.

    The API answers in Spanish: the `title` and `detail` values below and in the examples are the
    real ones and are not translated.

    | Code | When | `title` |
    | ---- | ---- | ------- |
    | 400 | Invalid request (format, validation or an argument the domain rejects) | Petición no válida |
    | 401 | Not authenticated (HTTP Basic) or invalid credentials | No autenticado |
    | 403 | Authenticated, but without the required role (only an administrator opens accounts or replaces an IBAN) | Acceso denegado |
    | 404 | The requested resource does not exist, or it is another customer's account (its existence is not revealed) | Recurso inexistente |
    | 415 | The request body is not JSON (operations with a body) | Tipo de contenido no admitido |
    | 422 | A domain business rule is violated | Regla de negocio incumplida |
  contact:
    name: Proyect-DDD-Claude
    url: https://github.com/dawnrock/Proyect-DDD-Claude/issues
  license:
    name: Practice project
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://proyect-ddd-claude.onrender.com
    description: Render deployment of the `Hexagonal` branch (free plan, the first request may take about a minute while it wakes up)
# Every operation needs HTTP Basic credentials (#50). An admin sees every account; a user only their own.
security:
  - basicAuth: []
tags:
  - name: accounts
    description: Checking accounts (#5).
  - name: transfers
    description: Transfers between accounts (#7).
  - name: customers
    description: Mon-A Bank customer sign-up (#95).
paths:
  /api/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List accounts, sorted by account number
      description: Every account for an admin; only the caller's own accounts for a user.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: All accounts (empty array if there are none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummary'
              examples:
                several:
                  summary: The three accounts of the demo profile, as an admin sees them
                  value:
                    - id: "e0b82ea0-6811-46c9-9f77-431e4b6ff72d"
                      accountNumber: "ES1099990001410000000002"
                      holderName: "Grace Hopper"
                      segment: "HIGH_NET_WORTH"
                      balance: 4700.00
                      currency: "EUR"
                    - id: "8016d0d2-d7cf-44cf-bf9f-aa62a253892e"
                      accountNumber: "ES8099990001450000000001"
                      holderName: "Ada Lovelace"
                      segment: "RETAIL"
                      balance: 1500.00
                      currency: "EUR"
                    - id: "acb47102-7688-44bb-a6ba-e05b56f0e8cd"
                      accountNumber: "ES8899990001440000000003"
                      holderName: "Alan Turing"
                      segment: "RETAIL"
                      balance: 200.00
                      currency: "EUR"
                empty:
                  summary: No accounts (or a user who has none)
                  value: []
    post:
      tags: [accounts]
      operationId: openAccount
      summary: Open a checking account with its initial deposit (admin only)
      description: |
        Only an admin opens accounts (403 otherwise). The bank assigns the IBAN (Mon-A Bank: entity `9999`, branch `0001`).
        The holder is identified by `holderTaxId`: if it already belongs to a customer, the account is opened for that
        customer and their user, and `holderName`, `holderEmail` and `ownerUsername` must be absent, blank or equal to
        the customer's (400 otherwise); if not, those three fields are required and the holder is registered as a customer.

        The IBAN is **generated** and the `segment` is **computed** from the holder's verified annual income
        (the holder is `HIGH_NET_WORTH` only above 100,000.00 EUR; an unknown tax id opens a `RETAIL` account).
        Since #98 the balance also counts: a holder becomes `HIGH_NET_WORTH` as soon as the account balance reaches
        100,000.00 EUR, and may go back to `RETAIL` after a review (see the `segment` property). Generated IBANs carry
        the entity code `9999` and branch `0001` of Mon-A Bank.

        **Incompatible change (#18):** the body no longer carries `accountNumber` or `segment`; it carries `holderTaxId`.

        **Incompatible change (#103):** `holderTaxId` accepts a DNI or a NIE and its control letter is checked; `holderName` and `ownerUsername` are only required for a new customer, together with the new `holderEmail`. For an existing customer (same document) they are absent, blank or equal to theirs; different data fail with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Account opened.
          headers:
            Location:
              description: URL of the new account (`/api/accounts/{id}`).
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
              examples:
                retail:
                  summary: A holder whose verified income is not above 100,000.00 EUR
                  value:
                    id: "5b1f3c2e-9a7d-4e8b-b1c4-2f6a8d9e0c11"
                    accountNumber: "ES5099990001480000000006"
                    holderName: "Katherine Johnson"
                    segment: "RETAIL"
                    balance: 150.00
                    currency: "EUR"
                highNetWorth:
                  summary: A holder whose verified income is above 100,000.00 EUR
                  value:
                    id: "7c2d4e6f-1a3b-4c5d-8e9f-0a1b2c3d4e5f"
                    accountNumber: "ES2399990001400000000004"
                    holderName: "Grace Hopper"
                    segment: "HIGH_NET_WORTH"
                    balance: 500.00
                    currency: "EUR"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/accounts/{id}:
    get:
      tags: [accounts]
      operationId: findAccount
      summary: Account details, with its transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetails'
              examples:
                withTransfer:
                  summary: An opening deposit and a transfer withdrawal (with the target account as counterpart)
                  value:
                    id: "e0b82ea0-6811-46c9-9f77-431e4b6ff72d"
                    accountNumber: "ES1099990001410000000002"
                    holderName: "Grace Hopper"
                    segment: "HIGH_NET_WORTH"
                    balance: 4700.00
                    currency: "EUR"
                    holderTaxId: "87654321X"
                    holderEmail: "grace@example.com"
                    transactions:
                      - id: "185fcd64-d242-4951-9be4-16f3c36601dd"
                        type: "DEPOSIT"
                        amount: 5000.00
                        currency: "EUR"
                        occurredOn: "2026-11-17T15:45:11.883Z"
                        status: "APPROVED"
                      - id: "7ed8bbfc-df88-4781-a908-99d39246b8c8"
                        type: "WITHDRAWAL"
                        amount: 300.00
                        currency: "EUR"
                        occurredOn: "2026-11-17T15:45:11.892Z"
                        status: "APPROVED"
                        counterpartAccountNumber: "ES8099990001450000000001"
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{id}/account-number:
    post:
      tags: [accounts]
      operationId: regenerateAccountNumber
      summary: Replace the IBAN of an account with a new one generated by the bank (admin only)
      description: Nobody types an IBAN; the new one comes from the bank's numbering and differs from the current one (R31).
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Account with its new IBAN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
              examples:
                newIban:
                  summary: The same account with an IBAN generated by the bank
                  value:
                    id: "acb47102-7688-44bb-a6ba-e05b56f0e8cd"
                    accountNumber: "ES0799990001420000000007"
                    holderName: "Alan Turing"
                    segment: "RETAIL"
                    balance: 200.00
                    currency: "EUR"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/customers:
    post:
      tags: [customers]
      operationId: signUp
      summary: Become a Mon-A Bank customer (public)
      description: |
        Registers the customer, opens their first account with an IBAN assigned by the bank and creates their user
        (role USER), all at once and without administrator approval. No credentials are needed. The new user can then
        use the API with HTTP Basic. A document is unique per customer (R29): signing up again with it fails with 422,
        whatever the e-mail.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
          description: Only when wrong HTTP Basic credentials are sent; the operation needs none.
        '201':
          description: Customer registered and first account opened.
          headers:
            Location:
              description: URL of the new account (`/api/accounts/{id}`).
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
              examples:
                newCustomer:
                  summary: A new customer and their first account
                  value:
                    id: "c3335c5d-b16a-4076-8cde-c27ddbdf2b3d"
                    accountNumber: "ES5099990001480000000006"
                    holderName: "Margaret Hamilton"
                    segment: "RETAIL"
                    balance: 100.00
                    currency: "EUR"
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/accounts/{id}/deposits:
    post:
      tags: [accounts]
      operationId: deposit
      summary: Deposit an amount into the account (#6)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Deposit recorded (always `APPROVED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/accounts/{id}/withdrawals:
    post:
      tags: [accounts]
      operationId: withdraw
      summary: Try to withdraw an amount from the account (#6)
      description: |
        A withdrawal that the overdraft rules do not allow is **not an error**: it is recorded with
        status `REJECTED`, the balance does not change, and the response is still `201`.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Withdrawal recorded, `APPROVED` or `REJECTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/transfers:
    post:
      tags: [transfers]
      operationId: transfer
      summary: Transfer an amount from a source account to a target account (#7)
      description: |
        Withdraws the amount from the source account and, **only if the withdrawal is approved**,
        deposits it in the target account. A transfer that the source account's overdraft rules do
        not allow is **not an error**: the source records a `REJECTED` withdrawal, nothing reaches
        the target, no balance changes, and the response is still `201`.

        An unknown source or target account is a 404. Transferring to the same account, or an amount
        in a currency other than the accounts', is a 422.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '201':
          description: Transfer processed, `APPROVED` or `REJECTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      description: Account id.
      schema:
        type: string
        format: uuid
  schemas:
    MovementRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 0.005
          maximum: 999999999.99
          description: "Rounded half-up to the currency's two decimals: from 0.005 (rounded to 0.01) to 999,999,999.99; outside that range the request fails with 400."
          examples: [25.00]
        currency:
          type: [string, 'null']
          enum: [EUR, null]
          default: EUR
          description: Every account is in EUR. Absent or `null` means EUR; another ISO 4217 currency fails with 422 and an invalid code with 400.
    TransferRequest:
      type: object
      required: [sourceAccountId, targetAccountNumber, amount]
      properties:
        sourceAccountId:
          type: string
          format: uuid
          description: Must be one of the caller's accounts (404 otherwise), unless the caller is an admin.
        targetAccountNumber:
          type: string
          description: Spanish IBAN of any existing account (404 if none); spaces and lowercase are accepted. Must be a different account from the source (422 otherwise). Replaces `targetAccountId` (#50).
          pattern: '^ *[Ee][Ss]( *\d){22} *$'
          examples: [ES79 2100 0813 6101 2345 6789]
        amount:
          type: number
          minimum: 0.005
          maximum: 999999999.99
          description: "Rounded half-up to the currency's two decimals: from 0.005 (rounded to 0.01) to 999,999,999.99; outside that range the request fails with 400."
          examples: [25.00]
        currency:
          type: [string, 'null']
          enum: [EUR, null]
          default: EUR
          description: Every account is in EUR. Absent or `null` means EUR; another ISO 4217 currency fails with 422 and an invalid code with 400.
    Transfer:
      type: object
      required: [sourceAccountId, sourceAccountNumber, targetAccountNumber, amount, currency, occurredOn, status]
      properties:
        sourceAccountId:
          type: string
          format: uuid
        sourceAccountNumber:
          type: string
          examples: [ES9121000418450200051332]
        targetAccountNumber:
          type: string
          examples: [ES7921000813610123456789]
        amount:
          type: number
          description: Amount of the withdrawal in the source, rounded to the currency's digits.
        currency:
          type: string
        occurredOn:
          type: string
          format: date-time
        status:
          type: string
          enum: [APPROVED, REJECTED]
          description: Status of the withdrawal in the source account.
    OpenAccountRequest:
      type: object
      required: [holderTaxId, initialDeposit]
      properties:
        holderTaxId:
          type: string
          description: Spanish DNI (8 digits + letter) or NIE (X, Y or Z + 7 digits + letter); spaces and lowercase are accepted. The control letter is checked (400 if wrong). The simulated tax agency verifies the holder's annual income with it.
          pattern: '^ *[XYZxyz0-9]\d{7} *[A-Za-z] *$'
          examples: [87654321X]
        initialDeposit:
          type: number
          minimum: 0.005
          maximum: 999999999.99
          description: "Rounded half-up to the currency's two decimals: from 0.005 (rounded to 0.01) to 999,999,999.99; outside that range the request fails with 400. Below the minimum initial deposit (50.00 EUR) it fails with 422."
          examples: [100.00]
        currency:
          type: [string, 'null']
          enum: [EUR, null]
          default: EUR
          description: Absent or `null` means EUR; another ISO 4217 currency fails with 422 and an invalid code with 400.
        holderName:
          type: [string, 'null']
          description: Required for a new customer; for an existing one, absent, blank or equal to theirs.
          examples: [Grace Hopper]
        holderEmail:
          type: [string, 'null']
          description: Required for a new customer; for an existing one, absent, blank or equal to theirs.
          pattern: '^$|^ *[^@\s]+@[^@\s]+\.[^@\s]+ *$'
          examples: [grace@example.com]
        ownerUsername:
          type: [string, 'null']
          description: User of a new customer, who will see and operate the account; for an existing customer, absent, blank or equal to theirs.
          pattern: '^$|^[a-z0-9._-]{3,30}$'
          examples: [grace]
    SignUpRequest:
      type: object
      required: [fullName, taxId, email, username, password, initialDeposit]
      properties:
        fullName:
          type: string
          minLength: 1
          examples: [Margaret Hamilton]
        taxId:
          type: string
          description: DNI or NIE, as in `OpenAccountRequest.holderTaxId`.
          pattern: '^ *[XYZxyz0-9]\d{7} *[A-Za-z] *$'
          examples: [X1234567L]
        email:
          type: string
          pattern: '^ *[^@\s]+@[^@\s]+\.[^@\s]+ *$'
          examples: [margaret@example.com]
        username:
          type: string
          description: Must be free (422 otherwise).
          pattern: '^[a-z0-9._-]{3,30}$'
          examples: [margaret]
        password:
          type: string
          minLength: 8
          writeOnly: true
          examples: [demo-1234]
        initialDeposit:
          type: number
          minimum: 0.005
          maximum: 999999999.99
          description: "Rounded half-up to the currency's two decimals: from 0.005 (rounded to 0.01) to 999,999,999.99; outside that range the request fails with 400. Below the minimum initial deposit (50.00 EUR) it fails with 422."
          examples: [100.00]
        currency:
          type: [string, 'null']
          enum: [EUR, null]
          default: EUR
          description: Absent or `null` means EUR; another ISO 4217 currency fails with 422 and an invalid code with 400.
    AccountSummary:
      type: object
      required: [id, accountNumber, holderName, segment, balance, currency]
      properties:
        id:
          type: string
          format: uuid
        accountNumber:
          type: string
          description: Normalized IBAN, always assigned by the bank (Mon-A Bank, entity 9999, branch 0001).
          examples: [ES8099990001450000000001]
        holderName:
          type: string
        segment:
          type: string
          enum: [RETAIL, HIGH_NET_WORTH]
          description: >-
            Never sent by the client. Computed from the holder's verified income when the account is opened (R20)
            and from the account balance afterwards: 100,000.00 EUR of balance promotes the holder (R22); after one
            month below that amount the income is verified again and the holder keeps the segment only if it is still
            above the threshold, with a new verification every six months (R24-R27).
        balance:
          type: number
          examples: [100.00]
        currency:
          type: string
          examples: [EUR]
    AccountDetails:
      allOf:
        - $ref: '#/components/schemas/AccountSummary'
        - type: object
          required: [holderTaxId, holderEmail, transactions]
          properties:
            holderTaxId:
              type: string
              description: Normalized document (DNI or NIE) of the holder.
              examples: [12345678Z]
            holderEmail:
              type: string
              description: E-mail of the customer who holds the account; empty if the holder is not a registered customer.
              examples: [ada@example.com]
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
    Transaction:
      type: object
      required: [id, type, amount, currency, occurredOn, status]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
        counterpartAccountNumber:
          type: string
          description: >-
            Normalised IBAN of the other account when the transaction belongs to a transfer
            (target on the source's withdrawal, source on the target's deposit). Omitted otherwise.
          examples: [ES7921000418450200051332]
    ProblemDetail:
      type: object
      description: Error in RFC 9457 format.
      required:
        - status
        - title
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    ValidationProblemDetail:
      description: 400 error. If it comes from body validation, `errors` carries one message per invalid field.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Username and password of a configured user (demo profile users are in the README).
  responses:
    Unauthorized:
      description: Not authenticated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Hace falta autenticarse para usar la API
    Forbidden:
      description: Access denied.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Acceso denegado
            status: 403
            detail: Solo un administrador puede abrir cuentas
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
          examples:
            invalidArgument:
              summary: Argument the domain rejects
              value:
                type: about:blank
                title: Petición no válida
                status: 400
                detail: El número de cuenta ES00 no es un IBAN español válido
            validation:
              summary: Body that fails validation
              value:
                type: about:blank
                title: Petición no válida
                status: 400
                detail: La petición tiene 1 campo(s) no válido(s)
                errors:
                  holderName: must not be blank
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Recurso inexistente
            status: 404
            detail: No existe la cuenta 9f1c…
    UnprocessableContent:
      description: A business rule is violated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Regla de negocio incumplida
            status: 422
            detail: El depósito inicial de 10.00 EUR no alcanza el mínimo exigido de 50.00 EUR
    UnsupportedMediaType:
      description: The request body is not JSON.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Tipo de contenido no admitido
            status: 415
            detail: 'El tipo de contenido text/plain no está admitido: envía application/json'
