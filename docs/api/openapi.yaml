openapi: 3.1.0
info:
  title: Proyect-DDD-Claude · API de cuentas corrientes
  version: 0.1.0
  description: |
    API REST de la fase 1 (monolito en capas). Contrato escrito a mano: cada funcionalidad añade
    aquí sus operaciones (ver `docs/contracts/`).

    Los errores de las operaciones de esta API usan el formato `ProblemDetail` (RFC 9457) y se
    traducen en un único punto (`RestExceptionHandler`). Una ruta que no existe (`/api/...` sin
    operación) la responde Spring Boot con su JSON de error estándar, no con `ProblemDetail`.

    | Código | Cuándo | `title` |
    | ------ | ------ | ------- |
    | 400 | Petición no válida (formato, validación o argumento que el dominio rechaza) | Petición no válida |
    | 404 | El recurso pedido no existe | Recurso inexistente |
    | 422 | Se incumple una regla de negocio del dominio | Regla de negocio incumplida |
  license:
    name: Proyecto de práctica
    identifier: MIT
servers:
  - url: http://localhost:8080
    description: Desarrollo local
# Practice project, run locally only: the API has no authentication.
security: []
tags:
  - name: accounts
    description: Checking accounts (#5).
paths:
  /api/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List accounts, sorted by account number
      responses:
        '200':
          description: All accounts (empty array if there are none).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccountSummary'
    post:
      tags: [accounts]
      operationId: openAccount
      summary: Open a checking account with its initial deposit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAccountRequest'
      responses:
        '201':
          description: Account opened.
          headers:
            Location:
              description: URL of the new account (`/api/accounts/{id}`).
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/accounts/{id}:
    get:
      tags: [accounts]
      operationId: findAccount
      summary: Account details, with its transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Account details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/accounts/{id}/deposits:
    post:
      tags: [accounts]
      operationId: deposit
      summary: Deposit an amount into the account (#6)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '201':
          description: Deposit recorded (always `APPROVED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
  /api/accounts/{id}/withdrawals:
    post:
      tags: [accounts]
      operationId: withdraw
      summary: Try to withdraw an amount from the account (#6)
      description: |
        A withdrawal that the overdraft rules do not allow is **not an error**: it is recorded with
        status `REJECTED`, the balance does not change, and the response is still `201`.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MovementRequest'
      responses:
        '201':
          description: Withdrawal recorded, `APPROVED` or `REJECTED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
components:
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      description: Account id.
      schema:
        type: string
        format: uuid
  schemas:
    MovementRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          example: 25.00
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: EUR
          description: ISO 4217 code. A currency other than the account's fails with 422.
    OpenAccountRequest:
      type: object
      required: [accountNumber, holderName, segment, initialDeposit]
      properties:
        accountNumber:
          type: string
          description: Spanish IBAN (`ES` + 22 digits); spaces and lowercase are accepted and normalized.
          pattern: '^ *[Ee][Ss]( *\d){22} *$'
          example: ES91 2100 0418 4502 0005 1332
        holderName:
          type: string
          minLength: 1
          example: Ada Lovelace
        segment:
          type: string
          enum: [RETAIL, HIGH_NET_WORTH]
        initialDeposit:
          type: number
          exclusiveMinimum: 0
          description: Must reach the minimum initial deposit (50.00 EUR) or the request fails with 422.
          example: 100.00
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: EUR
          description: ISO 4217 code. A currency other than EUR fails with 422.
    AccountSummary:
      type: object
      required: [id, accountNumber, holderName, balance, currency]
      properties:
        id:
          type: string
          format: uuid
        accountNumber:
          type: string
          description: Normalized IBAN.
          example: ES9121000418450200051332
        holderName:
          type: string
        balance:
          type: number
          example: 100.00
        currency:
          type: string
          example: EUR
    AccountDetails:
      allOf:
        - $ref: '#/components/schemas/AccountSummary'
        - type: object
          required: [segment, transactions]
          properties:
            segment:
              type: string
              enum: [RETAIL, HIGH_NET_WORTH]
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'
    Transaction:
      type: object
      required: [id, type, amount, currency, occurredOn, status]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
        amount:
          type: number
        currency:
          type: string
        occurredOn:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED]
    ProblemDetail:
      type: object
      description: Error en formato RFC 9457.
      required:
        - status
        - title
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
    ValidationProblemDetail:
      description: Error 400. Si viene de la validación del cuerpo, `errors` trae un mensaje por campo no válido.
      allOf:
        - $ref: '#/components/schemas/ProblemDetail'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
  responses:
    BadRequest:
      description: Petición no válida.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetail'
          examples:
            argumentoInvalido:
              summary: Argumento que el dominio rechaza
              value:
                type: about:blank
                title: Petición no válida
                status: 400
                detail: El número de cuenta ES00 no es un IBAN español válido
            validacion:
              summary: Cuerpo que no pasa la validación
              value:
                type: about:blank
                title: Petición no válida
                status: 400
                detail: La petición tiene 1 campo(s) no válido(s)
                errors:
                  holderName: must not be blank
    NotFound:
      description: El recurso pedido no existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Recurso inexistente
            status: 404
            detail: No existe la cuenta 9f1c…
    UnprocessableContent:
      description: Se incumple una regla de negocio.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          example:
            type: about:blank
            title: Regla de negocio incumplida
            status: 422
            detail: El depósito inicial de 10.00 EUR no alcanza el mínimo exigido de 50.00 EUR
