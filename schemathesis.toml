# Pruebas de contrato (#107, ADR 0013): Schemathesis comprueba que la API REST cumple docs/api/openapi.yaml.
# Se ejecuta con `node scripts/contract-test.mjs`, que arranca el jar con el perfil demo y pasa la URL.

# Ejecución determinista: el CI no debe ponerse en rojo porque aparezca un caso aleatorio nuevo.
# Para explorar casos nuevos, se cambia la semilla a propósito y lo que salga se trata en su propia issue.
seed = 108113

[generation]
deterministic = true
max-examples = 40

# Usuario administrador del perfil demo (contraseña de práctica, ya pública en el README).
[auth.basic]
username = "admin"
password = "demo"

# Rechazos legítimos con datos que el esquema da por válidos: un 422 es una regla de negocio que el contrato no
# puede expresar (depósito inicial mínimo, transferencia a la misma cuenta, documento o usuario repetidos).
# Se declaran como esperados; la comprobación sigue activa para todo lo demás.
[checks.positive_data_acceptance]
expected-statuses = ["2xx", "3xx", 401, 403, 404, 409, 422, 429, "5xx"]

# Abrir una cuenta y darse de alta: además, un 400 por reglas que un patrón no puede comprobar y que el contrato
# documenta en texto: la letra de control del DNI/NIE (módulo 23) y, al abrir una cuenta, la regla de la #103
# (el documento ya es de un cliente y llegan datos distintos de los suyos).
[[operations]]
include-operation-id = "openAccount"

[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "3xx", 400, 401, 403, 404, 409, 422, 429, "5xx"]

[[operations]]
include-operation-id = "signUp"

[operations.checks.positive_data_acceptance]
expected-statuses = ["2xx", "3xx", 400, 401, 403, 404, 409, 422, 429, "5xx"]
