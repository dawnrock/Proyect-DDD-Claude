spring.application.name=ddd-lab

# Servidor web embebido
server.port=8080
# La sesión (mensajes flash tras un Post/Redirect/Get) solo por cookie: Tomcat añadiría ;jsessionid a la
# URL de la redirección en la primera petición, y Spring no la reconoce (404)
server.servlet.session.tracking-modes=cookie

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:ddd;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always