spring.application.name=ddd-lab

# Servidor web embebido
server.port=8080
# La sesión (mensajes flash tras un Post/Redirect/Get) solo por cookie: Tomcat añadiría ;jsessionid a la
# URL de la redirección en la primera petición, y Spring no la reconoce (404)
server.servlet.session.tracking-modes=cookie
# Nada en la aplicación acepta multipart (#113). Activado, una petición multipart/form-data sin delimitador fallaba
# con 500 antes de llegar a ningún controlador. Si algún día hace falta subir ficheros, reactivarlo y traducir
# MultipartException.
spring.servlet.multipart.enabled=false

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:ddd;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info
# Detalles (BD, disco...) solo con sesión (#50): /actuator/health es público y sin login solo da el estado
management.endpoint.health.show-details=when-authorized
# Tokens JWT de la API (#122, ADR 0015): HS256 con el secreto de APP_JWT_SECRET (sin él, clave aleatoria al arrancar)
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl=PT15M
app.jwt.issuer=ddd-lab

# Recursos estáticos del frontend (ADR 0016): las URL llevan la versión del WebJar o un hash del contenido
# (/css/app-<md5>.css), así que el navegador puede guardarlos un año y un despliegue nuevo cambia la URL.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/vendor/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# IP real del cliente detrás del proxy de Render (#130, ADR 0017): Tomcat toma la última dirección de X-Forwarded-For que
# no sea de un proxy interno (10/8, 172.16/12, 192.168/16, 100.64/10, loopback...). Lo que añada el cliente por su
# cuenta queda a la izquierda y no cuenta. Sin proxy delante, la cabecera de un cliente externo se ignora.
server.forward-headers-strategy=native

# Límite de intentos de inicio de sesión (#130, ADR 0017): 3 fallos por usuario e IP, 10 por IP, 30 minutos.
app.security.login-attempts.max-per-user=3
app.security.login-attempts.max-per-ip=10
app.security.login-attempts.lockout=30m
