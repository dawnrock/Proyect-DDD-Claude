<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<!--/* Fragmentos comunes. Cada página lleva data-bs-theme="dark" en <html> (tema oscuro de Bootstrap, ADR 0016). */-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#212529">
    <title th:text="${title} + ' · monA Bank'">monA Bank</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/brand/favicon.svg}">
    <!--/* htmx (#126): sin copias de las páginas en sessionStorage (llevarían saldos e IBAN); volver atrás recarga. */-->
    <meta name="htmx-config" content='{"historyCacheSize":0,"refreshOnHistoryMiss":true}'>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!--/* Todo con defer y en este orden: app.js registra los componentes de Alpine antes de que Alpine arranque. */-->
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
    <script defer th:src="@{/vendor/motion/motion.js}"></script>
    <script defer th:src="@{/js/app.js}"></script>
    <script defer th:src="@{/webjars/alpinejs/dist/cdn.min.js}"></script>
</head>
<body class="d-flex flex-column min-vh-100" hx-boost="true" hx-swap="innerHTML transition:true">
<header th:fragment="header" class="border-bottom mb-4">
    <nav class="navbar app-container mx-auto w-100 px-3">
        <a class="navbar-brand d-inline-flex align-items-center" th:href="@{/}">
            <img th:src="@{/brand/monabank-horizontal.svg}" class="brand-logo" alt="monA Bank">
        </a>
        <form class="d-flex align-items-center gap-3 m-0 small text-body-secondary" th:if="${currentUser != null}" th:action="@{/logout}" method="post">
            <span class="d-inline-flex align-items-center gap-1"><svg th:replace="~{fragments/icons :: icon('user-round')}"></svg><span th:text="${currentUser}">usuario</span></span>
            <button class="btn btn-link btn-sm p-0 d-inline-flex align-items-center gap-1" type="submit"><svg th:replace="~{fragments/icons :: icon('log-out')}"></svg>Cerrar sesión</button>
        </form>
    </nav>
</header>
</body>
</html>
