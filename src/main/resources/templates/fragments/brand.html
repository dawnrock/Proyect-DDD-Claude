<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Glifos de la marca (#185, ADR 0023), con las coordenadas de los contornos del logo (static/brand/). Son decorativos:
     el texto que los acompaña ya dice qué son. El color lo pone el CSS (currentColor y las clases de app.css). */-->

<!--/* La subida: la pata izquierda de la A y su flecha. Dinero que entra (ingresos y transferencias recibidas). */-->
<svg th:fragment="rise" class="glyph glyph-rise" viewBox="316 -232 100 236" aria-hidden="true" focusable="false"
     fill="currentColor"><polygon points="319.57,2 350.98,-140 384.42,-140 358.7,2"></polygon><polygon points="353.76,-139 361.94,-176 390.94,-176 384.24,-139"></polygon><polygon points="412.68,-168.71 387.1,-228.96 340.21,-183.29"></polygon></svg>

<!--/* La caída: la barra y la pata derecha de la n. Dinero que sale (retiradas y transferencias enviadas). */-->
<svg th:fragment="drop" class="glyph glyph-drop" viewBox="232 -88 86 92" aria-hidden="true" focusable="false"
     fill="currentColor"><polygon points="235.2,-84 295.8,-84 313.8,-66 313.8,0 288.6,0 288.6,-62.1 235.2,-62.1"></polygon></svg>

<!--/* La A en contorno, con su pata verde tenue: marca de agua de las tarjetas de cuenta y del saldo. */-->
<svg th:fragment="watermark" class="watermark" viewBox="318 -232 136 238" aria-hidden="true" focusable="false"><path class="watermark-a" d="M358.8 0L323.2 0L354 -140L419.2 -140L450 0L414.4 0L408.6 -30L364.6 -30L358.8 0M380.4 -113.4L368.8 -54.2L404.4 -54.2L392.8 -113.4L380.4 -113.4"></path><g class="watermark-rise"><polygon points="319.57,2 350.98,-140 384.42,-140 358.7,2"></polygon><polygon points="353.76,-139 361.94,-176 390.94,-176 384.24,-139"></polygon><polygon points="412.68,-168.71 387.1,-228.96 340.21,-183.29"></polygon></g></svg>

<!--/* La A oscurecida y más grande que la pantalla, detrás de las pantallas de entrada (puertas, acceso y alta). */-->
<div th:fragment="backdrop" class="backdrop" aria-hidden="true"><svg viewBox="318 -232 136 238" focusable="false"><path class="backdrop-a" d="M358.8 0L323.2 0L354 -140L419.2 -140L450 0L414.4 0L408.6 -30L364.6 -30L358.8 0M380.4 -113.4L368.8 -54.2L404.4 -54.2L392.8 -113.4L380.4 -113.4"></path><g class="backdrop-rise"><polygon points="319.57,2 350.98,-140 384.42,-140 358.7,2"></polygon><polygon points="353.76,-139 361.94,-176 390.94,-176 384.24,-139"></polygon><polygon points="412.68,-168.71 387.1,-228.96 340.21,-183.29"></polygon></g></svg></div>
</body>
</html>
