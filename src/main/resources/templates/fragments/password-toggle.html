<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Botón «Mostrar contraseña» (#146) para el campo con id «field». Va dentro del .input-group del campo. Está oculto
     (hidden) hasta que app.js lo muestra, así que sin JavaScript no aparece; al pulsarlo, app.js alterna el type del campo
     entre password y text (#206, sin Alpine.js ni estilos en línea: CSP). El texto no cambia: el estado lo anuncia
     aria-pressed, como en cualquier botón conmutador; a la vista, el icono (ojo / ojo tachado) y la clase active. */-->
<button th:fragment="button(field)" class="btn btn-outline-secondary" type="button" data-password-toggle hidden
        th:aria-controls="${field}" aria-pressed="false"><span data-shown="false"><svg th:replace="~{fragments/icons :: icon('eye')}"></svg></span><span data-shown="true" hidden><svg th:replace="~{fragments/icons :: icon('eye-off')}"></svg></span><span class="visually-hidden">Mostrar contraseña</span></button>
</body>
</html>
