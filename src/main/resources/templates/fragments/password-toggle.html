<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Botón «Mostrar contraseña» (#146) para el campo con id «field». Va dentro de un .input-group con
     x-data="passwordToggle" y el campo lleva x-bind:type="shown ? 'text' : 'password'". Está oculto hasta que Alpine.js
     arranca (x-bind:hidden="false"), así que sin JavaScript no aparece. El texto no cambia: el estado lo anuncia
     aria-pressed, como en cualquier botón conmutador; a la vista, el icono (ojo / ojo tachado) y la clase active. */-->
<button th:fragment="button(field)" class="btn btn-outline-secondary" type="button" hidden x-bind:hidden="false"
        th:aria-controls="${field}" aria-pressed="false" x-bind:aria-pressed="shown ? 'true' : 'false'"
        x-bind:class="{ active: shown }" x-on:click="shown = !shown"><span x-show="!shown"><svg th:replace="~{fragments/icons :: icon('eye')}"></svg></span><span x-show="shown" style="display: none"><svg th:replace="~{fragments/icons :: icon('eye-off')}"></svg></span><span class="visually-hidden">Mostrar contraseña</span></button>
</body>
</html>
