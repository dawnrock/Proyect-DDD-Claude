<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* Barra de progreso del alta: step es 1, 2 o 3. */-->
<nav th:fragment="progress(step)" class="progress" aria-label="Progreso del alta">
    <p class="progress-label muted" th:text="'Paso ' + ${step} + ' de 3'">Paso 1 de 3</p>
    <ol class="progress-bar">
        <li th:each="n : ${#numbers.sequence(1, 3)}" th:classappend="${n <= step} ? 'done'"
            th:attr="aria-current=${n == step} ? 'step'"></li>
    </ol>
</nav>
</body>
</html>
