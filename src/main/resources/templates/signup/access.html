<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tu acceso')}"></head>
<body class="d-flex flex-column min-vh-100" hx-boost="true" hx-swap="innerHTML transition:true">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-container mx-auto w-100 px-3 pb-5">
    <a class="link-secondary text-decoration-none d-inline-flex align-items-center gap-1 mb-3" th:href="@{/signup}"><svg th:replace="~{fragments/icons :: icon('arrow-left')}"></svg>Atrás</a>
    <h1 class="h3 fw-semibold mb-3">Crea tu acceso</h1>
    <nav th:replace="~{signup/progress :: progress(2)}"></nav>

    <form class="card card-body" th:action="@{/signup/access}" th:object="${signUpForm}" method="post" novalidate>
        <div class="alert alert-danger d-flex align-items-center gap-2" role="alert" th:if="${signUpError}"><svg th:replace="~{fragments/icons :: icon('circle-alert')}"></svg><span th:text="${signUpError}">Error</span></div>

        <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control" type="text" id="username" required enterkeyhint="next" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus th:field="*{username}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('username')} ? 'true'" th:aria-describedby="${#fields.hasErrors('username')} ? 'username-help username-error' : 'username-help'">
            <p class="form-text mb-0" id="username-help">De 3 a 30 caracteres: minúsculas sin tildes ni ñ, dígitos, puntos, guiones bajos o guiones. Si escribes mayúsculas, se guarda en minúsculas.</p>
            <p class="invalid-feedback" id="username-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <!--/* La contraseña nunca se pinta de vuelta: ni th:field ni value. */-->
        <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <div class="input-group has-validation" x-data="passwordToggle">
                <input class="form-control" type="password" id="password" required enterkeyhint="next" name="password" autocomplete="new-password" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" th:aria-invalid="${#fields.hasErrors('password')} ? 'true'" th:aria-describedby="${#fields.hasErrors('password')} ? 'password-error'" x-bind:type="shown ? 'text' : 'password'">
                <button th:replace="~{fragments/password-toggle :: button('password')}"></button>
                <p class="invalid-feedback" id="password-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="passwordRepetition">Repite la contraseña</label>
            <div class="input-group has-validation" x-data="passwordToggle">
                <input class="form-control" type="password" id="passwordRepetition" required enterkeyhint="next" name="passwordRepetition" autocomplete="new-password" th:classappend="${#fields.hasErrors('passwordRepetition')} ? 'is-invalid'" th:aria-invalid="${#fields.hasErrors('passwordRepetition')} ? 'true'" th:aria-describedby="${#fields.hasErrors('passwordRepetition')} ? 'passwordRepetition-error'" x-bind:type="shown ? 'text' : 'password'">
                <button th:replace="~{fragments/password-toggle :: button('passwordRepetition')}"></button>
                <p class="invalid-feedback" id="passwordRepetition-error" th:if="${#fields.hasErrors('passwordRepetition')}" th:errors="*{passwordRepetition}"></p>
            </div>
        </div>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-primary" type="submit">Continuar</button>
            <a class="link-secondary text-decoration-none" th:href="@{/signup}">Atrás</a>
        </div>
    </form>
</main>
</body>
</html>
