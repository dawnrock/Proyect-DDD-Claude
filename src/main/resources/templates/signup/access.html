<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tu acceso')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-container mx-auto w-100 px-3 pb-5">
    <a class="back" th:href="@{/signup}">← Atrás</a>
    <h1>Crea tu acceso</h1>
    <nav th:replace="~{signup/progress :: progress(2)}"></nav>

    <form class="panel" th:action="@{/signup/access}" th:object="${signUpForm}" method="post" novalidate>
        <div class="flash flash-error" role="alert" th:if="${signUpError}">
            <p th:text="${signUpError}"></p>
        </div>

        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus th:field="*{username}">
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
        </div>

        <!--/* La contraseña nunca se pinta de vuelta: ni th:field ni value. */-->
        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="field">
            <label for="passwordRepetition">Repite la contraseña</label>
            <input type="password" id="passwordRepetition" name="passwordRepetition" autocomplete="new-password">
            <p class="field-error" th:if="${#fields.hasErrors('passwordRepetition')}" th:errors="*{passwordRepetition}"></p>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Continuar</button>
            <a th:href="@{/signup}">Atrás</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
