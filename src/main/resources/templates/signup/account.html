<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tu cuenta')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-container mx-auto w-100 px-3 pb-5">
    <a class="back" th:href="@{/signup/access}">← Atrás</a>
    <h1>Abre tu cuenta</h1>
    <nav th:replace="~{signup/progress :: progress(3)}"></nav>

    <!--/* Resumen de los pasos anteriores. La contraseña no aparece. */-->
    <dl class="summary">
        <div><dt>Nombre</dt><dd th:text="${signUpForm.fullName}">Nombre</dd></div>
        <div><dt>Documento</dt><dd th:text="${signUpForm.taxId}">12345678Z</dd></div>
        <div><dt>Correo</dt><dd th:text="${signUpForm.email}">correo@example.com</dd></div>
        <div><dt>Usuario</dt><dd th:text="${signUpForm.username}">usuario</dd></div>
    </dl>

    <form class="panel" th:action="@{/signup/account}" th:object="${signUpForm}" method="post" novalidate>
        <p class="flash flash-error" role="alert" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

        <div class="field">
            <label for="initialDeposit">Depósito inicial</label>
            <input type="number" id="initialDeposit" step="0.01" inputmode="decimal" autofocus th:field="*{initialDeposit}">
            <p class="field-error" th:if="${#fields.hasErrors('initialDeposit')}" th:errors="*{initialDeposit}"></p>
        </div>

        <div class="field">
            <label for="currency">Divisa</label>
            <select id="currency" th:field="*{currency}">
                <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">EUR</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}"></p>
        </div>

        <div class="field field-check">
            <label for="conditionsAccepted">
                <input type="checkbox" id="conditionsAccepted" th:field="*{conditionsAccepted}">
                Acepto las condiciones de Mon-A Bank
            </label>
            <p class="field-error" th:if="${#fields.hasErrors('conditionsAccepted')}" th:errors="*{conditionsAccepted}"></p>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Abrir mi cuenta</button>
            <a th:href="@{/signup/access}">Atrás</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
