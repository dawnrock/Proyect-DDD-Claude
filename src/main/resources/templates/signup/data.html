<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hazte cliente')}"></head>
<body class="d-flex flex-column min-vh-100" hx-boost="true" hx-swap="innerHTML transition:true">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-container mx-auto w-100 px-3 pb-5">
    <a class="link-secondary text-decoration-none d-inline-flex align-items-center gap-1 mb-3" th:href="@{/login}"><svg th:replace="~{fragments/icons :: icon('arrow-left')}"></svg>Volver</a>
    <img class="brand-welcome" th:src="@{/brand/monabank-stacked.svg}" alt="">
    <h1 class="h3 fw-semibold mb-3">Hazte cliente de monA Bank</h1>
    <nav th:replace="~{signup/progress :: progress(1)}"></nav>

    <form class="card card-body" th:action="@{/signup}" th:object="${signUpForm}" method="post" novalidate>
        <div class="alert alert-danger" role="alert" th:if="${signUpError}">
            <p class="d-flex align-items-center gap-2 mb-0"><svg th:replace="~{fragments/icons :: icon('circle-alert')}"></svg><span th:text="${signUpError}">Error</span></p>
            <p class="mt-2 mb-0" th:if="${duplicateCustomer}"><a class="alert-link" th:href="@{/login(form)}">Entrar con mi usuario</a></p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="fullName">Nombre y apellidos</label>
            <input class="form-control" type="text" id="fullName" required enterkeyhint="next" autocomplete="name" autofocus th:field="*{fullName}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('fullName')} ? 'true'" th:aria-describedby="${#fields.hasErrors('fullName')} ? 'fullName-error'">
            <p class="invalid-feedback" id="fullName-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="taxId">DNI o NIE</label>
            <input class="form-control" type="text" id="taxId" required enterkeyhint="next" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="12345678Z" th:field="*{taxId}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('taxId')} ? 'true'" th:aria-describedby="${#fields.hasErrors('taxId')} ? 'taxId-error'">
            <p class="invalid-feedback" id="taxId-error" th:if="${#fields.hasErrors('taxId')}" th:errors="*{taxId}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="email">Correo electrónico</label>
            <input class="form-control" type="email" id="email" required enterkeyhint="next" autocomplete="email" th:field="*{email}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('email')} ? 'true'" th:aria-describedby="${#fields.hasErrors('email')} ? 'email-error'">
            <p class="invalid-feedback" id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-primary" type="submit">Continuar</button>
            <a class="link-secondary text-decoration-none" th:href="@{/login}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
