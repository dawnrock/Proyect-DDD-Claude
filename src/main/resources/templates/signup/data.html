<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hazte cliente')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <a class="back" th:href="@{/login}">← Volver</a>
    <h1>Hazte cliente de Mon-A Bank</h1>
    <nav th:replace="~{signup/progress :: progress(1)}"></nav>

    <form class="panel" th:action="@{/signup}" th:object="${signUpForm}" method="post" novalidate>
        <div class="flash flash-error" role="alert" th:if="${signUpError}">
            <p th:text="${signUpError}"></p>
            <p th:if="${duplicateCustomer}"><a th:href="@{/login(form)}">Entrar con mi usuario</a></p>
        </div>

        <div class="field">
            <label for="fullName">Nombre y apellidos</label>
            <input type="text" id="fullName" autocomplete="name" autofocus th:field="*{fullName}">
            <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
        </div>

        <div class="field">
            <label for="taxId">DNI o NIE</label>
            <input type="text" id="taxId" autocomplete="off" spellcheck="false" placeholder="12345678Z" th:field="*{taxId}">
            <p class="field-error" th:if="${#fields.hasErrors('taxId')}" th:errors="*{taxId}"></p>
        </div>

        <div class="field">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" autocomplete="email" th:field="*{email}">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Continuar</button>
            <a th:href="@{/login}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
