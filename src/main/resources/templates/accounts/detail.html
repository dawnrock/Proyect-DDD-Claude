<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de cuenta')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <a class="back" th:href="@{/}">← Cuentas</a>
    <p th:if="${message}" class="flash flash-success" th:text="${message}"></p>
    <p th:if="${rejection}" class="flash flash-warning" th:text="${rejection}"></p>

    <div class="hero">
        <h1 class="hero-label"><span th:text="${account.holderName()}">Titular</span> · <span class="nowrap" th:text="${account.accountNumber()}">ES00</span></h1>
        <p class="hero-amount" th:text="${@fmt.money(account.balance(), account.currency())}">0,00 €</p>
        <p class="hero-sub" th:text="${account.segment() == 'RETAIL' ? 'Minorista' : (account.segment() == 'HIGH_NET_WORTH' ? 'Alto patrimonio' : account.segment())}">Minorista</p>
    </div>

    <div class="movements">
        <form th:action="@{/accounts/{id}/deposits(id=${account.id()})}" th:object="${depositForm}" method="post" novalidate>
            <h2>Ingresar</h2>
            <p class="flash flash-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            <div class="field">
                <label for="deposit-amount">Importe</label>
                <input type="number" id="deposit-amount" step="0.01" th:field="*{amount}">
                <p class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></p>
            </div>
            <div class="field">
                <label for="deposit-currency">Divisa</label>
                <select id="deposit-currency" th:field="*{currency}">
                    <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">EUR</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}"></p>
            </div>
            <button class="button" type="submit">Ingresar</button>
        </form>

        <form th:action="@{/accounts/{id}/withdrawals(id=${account.id()})}" th:object="${withdrawalForm}" method="post" novalidate>
            <h2>Retirar</h2>
            <p class="flash flash-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
            <div class="field">
                <label for="withdrawal-amount">Importe</label>
                <input type="number" id="withdrawal-amount" step="0.01" th:field="*{amount}">
                <p class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></p>
            </div>
            <div class="field">
                <label for="withdrawal-currency">Divisa</label>
                <select id="withdrawal-currency" th:field="*{currency}">
                    <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">EUR</option>
                </select>
                <p class="field-error" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}"></p>
            </div>
            <button class="button" type="submit">Retirar</button>
        </form>
    </div>

    <h2>Transferir</h2>
    <p th:if="${targetAccounts.isEmpty()}" class="empty">No hay otras cuentas a las que transferir</p>
    <form th:unless="${targetAccounts.isEmpty()}" th:action="@{/accounts/{id}/transfers(id=${account.id()})}" th:object="${transferForm}" method="post" novalidate>
        <p class="flash flash-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        <div class="field">
            <label for="transfer-target">Cuenta de destino</label>
            <select id="transfer-target" th:field="*{targetAccountId}">
                <option value="">Elige una cuenta</option>
                <option th:each="a : ${targetAccounts}" th:value="${a.id()}" th:text="${a.accountNumber() + ' · ' + a.holderName()}">ES00 · Titular</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('targetAccountId')}" th:errors="*{targetAccountId}"></p>
        </div>
        <div class="field">
            <label for="transfer-amount">Importe</label>
            <input type="number" id="transfer-amount" step="0.01" th:field="*{amount}">
            <p class="field-error" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></p>
        </div>
        <div class="field">
            <label for="transfer-currency">Divisa</label>
            <select id="transfer-currency" th:field="*{currency}">
                <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">EUR</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}"></p>
        </div>
        <button class="button" type="submit">Transferir</button>
    </form>

    <h2>Movimientos</h2>
    <ul class="list" th:if="${!account.transactions().isEmpty()}">
        <li class="row" th:each="t : ${account.transactions()}" th:classappend="${t.status() == 'REJECTED'} ? 'row-rejected'">
            <span class="row-main">
                <span class="row-title" th:text="${t.type() == 'DEPOSIT' ? 'Ingreso' : (t.type() == 'WITHDRAWAL' ? 'Retirada' : t.type())}">Ingreso</span>
                <span class="row-sub"><span th:text="${#temporals.format(t.occurredOn(), 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</span><span class="status" th:if="${t.status() == 'REJECTED'}"> · Rechazado</span><span class="status" th:if="${t.status() == 'PENDING'}"> · Pendiente</span></span>
            </span>
            <span class="row-amount" th:classappend="${t.type() == 'DEPOSIT' and t.status() == 'APPROVED'} ? 'positive'"
                  th:text="${@fmt.signedMoney(t.amount(), t.currency(), t.type() == 'DEPOSIT')}">+0,00 €</span>
        </li>
    </ul>
    <p th:if="${account.transactions().isEmpty()}" class="empty">Todavía no hay movimientos.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
