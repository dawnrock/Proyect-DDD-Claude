<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Abrir cuenta')}"></head>
<body class="d-flex flex-column min-vh-100" hx-boost="true" hx-swap="innerHTML transition:true">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-container mx-auto w-100 px-3 pb-5">
    <a class="link-secondary text-decoration-none d-inline-flex align-items-center gap-1 mb-3" th:href="@{/}"><svg th:replace="~{fragments/icons :: icon('arrow-left')}"></svg>Cuentas</a>
    <h1 class="h3 fw-semibold mb-4">Abrir cuenta</h1>
    <form class="card card-body" th:action="@{/accounts/new}" th:object="${form}" method="post" novalidate>
        <div class="alert alert-danger d-flex align-items-center gap-2" role="alert" th:each="err : ${#fields.globalErrors()}"><svg th:replace="~{fragments/icons :: icon('circle-alert')}"></svg><span th:text="${err}">Error</span></div>

        <p class="form-text mt-0 mb-3">Si el documento ya es de un cliente, deja en blanco nombre, correo y usuario: la cuenta se abre a su nombre.</p>

        <div class="mb-3">
            <label class="form-label" for="holderTaxId">DNI o NIE del titular</label>
            <input class="form-control" type="text" id="holderTaxId" required autocapitalize="characters" spellcheck="false" autocomplete="off" placeholder="12345678Z" th:field="*{holderTaxId}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('holderTaxId')} ? 'true'" th:aria-describedby="${#fields.hasErrors('holderTaxId')} ? 'holderTaxId-error'">
            <p class="invalid-feedback" id="holderTaxId-error" th:if="${#fields.hasErrors('holderTaxId')}" th:errors="*{holderTaxId}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="holderName">Titular (solo cliente nuevo)</label>
            <input class="form-control" type="text" id="holderName" th:field="*{holderName}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('holderName')} ? 'true'" th:aria-describedby="${#fields.hasErrors('holderName')} ? 'holderName-error'">
            <p class="invalid-feedback" id="holderName-error" th:if="${#fields.hasErrors('holderName')}" th:errors="*{holderName}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="holderEmail">Correo del titular (solo cliente nuevo)</label>
            <input class="form-control" type="email" id="holderEmail" autocomplete="off" th:field="*{holderEmail}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('holderEmail')} ? 'true'" th:aria-describedby="${#fields.hasErrors('holderEmail')} ? 'holderEmail-error'">
            <p class="invalid-feedback" id="holderEmail-error" th:if="${#fields.hasErrors('holderEmail')}" th:errors="*{holderEmail}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="ownerUsername">Usuario del titular (solo cliente nuevo)</label>
            <input class="form-control" type="text" id="ownerUsername" autocomplete="off" autocapitalize="none" spellcheck="false" th:field="*{ownerUsername}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('ownerUsername')} ? 'true'" th:aria-describedby="${#fields.hasErrors('ownerUsername')} ? 'ownerUsername-error'">
            <p class="invalid-feedback" id="ownerUsername-error" th:if="${#fields.hasErrors('ownerUsername')}" th:errors="*{ownerUsername}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="initialDeposit">Depósito inicial</label>
            <input class="form-control" type="number" id="initialDeposit" required step="0.01" inputmode="decimal" th:field="*{initialDeposit}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('initialDeposit')} ? 'true'" th:aria-describedby="${#fields.hasErrors('initialDeposit')} ? 'initialDeposit-error'">
            <p class="invalid-feedback" id="initialDeposit-error" th:if="${#fields.hasErrors('initialDeposit')}" th:errors="*{initialDeposit}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label" for="currency">Divisa</label>
            <select class="form-select" id="currency" th:field="*{currency}" th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('currency')} ? 'true'" th:aria-describedby="${#fields.hasErrors('currency')} ? 'currency-error'">
                <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">EUR</option>
            </select>
            <p class="invalid-feedback" id="currency-error" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}"></p>
        </div>

        <p class="form-text mt-0 mb-3">El número de cuenta (IBAN) se genera automáticamente y el segmento se decide según los ingresos verificados del titular.</p>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-primary" type="submit">Abrir cuenta</button>
            <a class="link-secondary text-decoration-none" th:href="@{/}">Cancelar</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
