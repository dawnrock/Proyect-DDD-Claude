<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Abrir cuenta')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>Abrir cuenta</h1>
    <form th:action="@{/accounts/new}" th:object="${form}" method="post" novalidate>
        <p class="flash flash-error" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>

        <div class="field">
            <label for="accountNumber">Número de cuenta</label>
            <input type="text" id="accountNumber" th:field="*{accountNumber}" placeholder="ES00 0000 0000 0000 0000 0000">
            <p class="field-error" th:if="${#fields.hasErrors('accountNumber')}" th:errors="*{accountNumber}"></p>
        </div>

        <div class="field">
            <label for="holderName">Titular</label>
            <input type="text" id="holderName" th:field="*{holderName}">
            <p class="field-error" th:if="${#fields.hasErrors('holderName')}" th:errors="*{holderName}"></p>
        </div>

        <div class="field">
            <label for="segment">Segmento</label>
            <select id="segment" th:field="*{segment}">
                <option value="">Selecciona un segmento</option>
                <option th:each="s : ${segments}" th:value="${s.key}" th:text="${s.value}">Segmento</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('segment')}" th:errors="*{segment}"></p>
        </div>

        <div class="field">
            <label for="initialDeposit">Depósito inicial</label>
            <input type="number" id="initialDeposit" step="0.01" th:field="*{initialDeposit}">
            <p class="field-error" th:if="${#fields.hasErrors('initialDeposit')}" th:errors="*{initialDeposit}"></p>
        </div>

        <div class="field">
            <label for="currency">Divisa</label>
            <select id="currency" th:field="*{currency}">
                <option th:each="c : ${currencies}" th:value="${c}" th:text="${c}">EUR</option>
            </select>
            <p class="field-error" th:if="${#fields.hasErrors('currency')}" th:errors="*{currency}"></p>
        </div>

        <button class="button" type="submit">Abrir cuenta</button>
        <a th:href="@{/}">Cancelar</a>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
