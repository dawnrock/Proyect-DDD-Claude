<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cuentas')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <div class="page-head">
        <h1>Cuentas</h1>
        <a class="pill pill-primary" th:href="@{/accounts/new}">+ Abrir cuenta</a>
    </div>
    <p th:if="${message}" class="flash flash-success" th:text="${message}"></p>

    <div class="hero" th:unless="${accounts.isEmpty()}">
        <p class="hero-label">Saldo total</p>
        <p class="hero-amount" th:each="total : ${totals}" th:text="${@fmt.money(total.value, total.key)}">0,00 €</p>
    </div>

    <ul class="list" th:unless="${accounts.isEmpty()}">
        <li th:each="account : ${accounts}">
            <a class="row" th:href="@{/accounts/{id}(id=${account.id()})}">
                <span class="avatar" aria-hidden="true" th:text="${@fmt.initials(account.holderName())}">AP</span>
                <span class="row-main">
                    <span class="row-title" th:text="${account.holderName()}">Titular</span>
                    <span class="row-sub" th:text="${@fmt.maskedIban(account.accountNumber())}"
                          th:title="${account.accountNumber()}">ES00 •••• 0000</span>
                </span>
                <span class="row-amount" th:text="${@fmt.money(account.balance(), account.currency())}">0,00 €</span>
            </a>
        </li>
    </ul>
    <p th:if="${accounts.isEmpty()}" class="empty">Todavía no hay cuentas. Abre la primera.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
