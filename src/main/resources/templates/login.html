<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acceso')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main>
    <h1>Acceso</h1>
    <form class="panel" th:action="@{/login}" method="post">
        <p class="flash flash-error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos</p>
        <p class="flash flash-success" role="status" th:if="${param.logout}">Has cerrado la sesión</p>

        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Entrar</button>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
