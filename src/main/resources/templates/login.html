<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acceso')}"></head>
<body class="d-flex flex-column min-vh-100">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-container mx-auto w-100 px-3 pb-5">
    <h1 th:text="${showForm} ? 'Acceso' : 'Bienvenido a Mon-A Bank'">Acceso</h1>
    <p class="flash flash-success" role="status" th:if="${param.logout}">Has cerrado la sesión</p>

    <div class="doors" th:unless="${showForm}">
        <a class="door" th:href="@{/login(form)}">
            <span class="door-title">Ya soy cliente</span>
            <span class="door-text">Entra con tu usuario y tu contraseña.</span>
        </a>
        <a class="door" th:href="@{/signup}">
            <span class="door-title">Quiero ser cliente</span>
            <span class="door-text">Abre tu cuenta en tres pasos.</span>
        </a>
    </div>

    <form class="panel" th:if="${showForm}" th:action="@{/login}" method="post">
        <p class="flash flash-error" role="alert" th:if="${param.error}">Usuario o contraseña incorrectos</p>

        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" autofocus required>
        </div>

        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <div class="form-actions">
            <button class="button" type="submit">Entrar</button>
            <a th:href="@{/login}">← Volver</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
