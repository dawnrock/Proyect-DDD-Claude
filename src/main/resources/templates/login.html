<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Acceso')}"></head>
<body class="d-flex flex-column min-vh-100" hx-boost="true" hx-swap="innerHTML transition:true">
<header th:replace="~{fragments/layout :: header}"></header>
<main class="app-container mx-auto w-100 px-3 pb-5">
    <h1 class="h3 fw-semibold mb-4" th:text="${showForm} ? 'Acceso' : 'Bienvenido a Mon-A Bank'">Acceso</h1>
    <div class="alert alert-success d-flex align-items-center gap-2" role="status" th:if="${param.logout}"><svg th:replace="~{fragments/icons :: icon('circle-check')}"></svg>Has cerrado la sesión</div>

    <div class="row row-cols-1 row-cols-sm-2 g-3" th:unless="${showForm}">
        <div class="col">
            <a class="card card-body h-100 text-reset text-decoration-none door" th:href="@{/login(form)}">
                <span class="d-inline-flex align-items-center gap-2 fw-semibold mb-1"><svg th:replace="~{fragments/icons :: icon('log-in')}"></svg>Ya soy cliente</span>
                <span class="small text-body-secondary">Entra con tu usuario y tu contraseña.</span>
            </a>
        </div>
        <div class="col">
            <a class="card card-body h-100 text-reset text-decoration-none door" th:href="@{/signup}">
                <span class="d-inline-flex align-items-center gap-2 fw-semibold mb-1"><svg th:replace="~{fragments/icons :: icon('user-round-plus')}"></svg>Quiero ser cliente</span>
                <span class="small text-body-secondary">Abre tu cuenta en tres pasos.</span>
            </a>
        </div>
    </div>

    <form class="card card-body" th:if="${showForm}" th:action="@{/login}" method="post">
        <div class="alert alert-danger d-flex align-items-center gap-2" role="alert" th:if="${param.error}"><svg th:replace="~{fragments/icons :: icon('circle-alert')}"></svg>Usuario o contraseña incorrectos</div>
        <div class="alert alert-danger d-flex align-items-center gap-2" role="alert" th:if="${param.blocked}"><svg th:replace="~{fragments/icons :: icon('shield-x')}"></svg><span th:text="|Demasiados intentos fallidos. Vuelve a intentarlo dentro de ${lockoutMinutes} minutos.|">Demasiados intentos fallidos. Vuelve a intentarlo dentro de 30 minutos.</span></div>

        <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control" type="text" id="username" autocapitalize="none" spellcheck="false" name="username" autocomplete="username" autofocus required>
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <div class="input-group" x-data="passwordToggle">
                <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required x-bind:type="shown ? 'text' : 'password'">
                <button th:replace="~{fragments/password-toggle :: button('password')}"></button>
            </div>
        </div>

        <div class="d-flex align-items-center gap-3">
            <button class="btn btn-primary d-inline-flex align-items-center gap-2" type="submit"><svg th:replace="~{fragments/icons :: icon('log-in')}"></svg>Entrar</button>
            <a class="link-secondary text-decoration-none d-inline-flex align-items-center gap-1" th:href="@{/login}"><svg th:replace="~{fragments/icons :: icon('arrow-left')}"></svg>Volver</a>
        </div>
    </form>
</main>
</body>
</html>
