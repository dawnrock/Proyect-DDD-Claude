# Perfil prod (#150, ADR 0019): PostgreSQL gestionado en Neon (AWS eu-central-1). En Render se activa con
# SPRING_PROFILES_ACTIVE=demo,prod y las tres variables SPRING_DATASOURCE_* como secretos, con la cadena de conexión
# directa (sin pooling) de Neon. Sin valores por defecto: si falta una variable, la aplicación no arranca en lugar de
# usar la H2 en memoria y perder los datos en el siguiente reinicio.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Pocas conexiones: el plan gratuito de Neon limita las conexiones y la instancia de Render tiene 512 MB
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.h2.console.enabled=false
