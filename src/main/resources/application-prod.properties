# Perfil prod (#150, ADR 0019): PostgreSQL gestionado en Neon (AWS eu-central-1). En Render se activa con
# SPRING_PROFILES_ACTIVE=demo,prod y las tres variables SPRING_DATASOURCE_* como secretos, con la cadena de conexión
# directa (sin pooling) de Neon. Sin valores por defecto: si falta una variable, la aplicación no arranca en lugar de
# usar la H2 en memoria y perder los datos en el siguiente reinicio.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Pocas conexiones: el plan gratuito de Neon limita las conexiones y la instancia de Render tiene 512 MB
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.h2.console.enabled=false
# Tiempos de espera (#156). Por defecto el driver de PostgreSQL espera sin límite al iniciar sesión (loginTimeout=0) y
# al leer (socketTimeout=0): el 2026-11-23 el primer despliegue contra Neon se quedó colgado sin ningún error mientras
# su cómputo despertaba, hasta que Render lo dio por caducado. Van como propiedades del driver, no en la URL, para que
# la URL de Neon sea solo ...?sslmode=require; un parámetro en la URL tiene prioridad sobre ellas. En segundos:
# conexión TCP + SSL, intento de conexión completo (el arranque en frío de Neon tarda unos 7 s) y cualquier lectura.
spring.datasource.hikari.data-source-properties.connectTimeout=15
spring.datasource.hikari.data-source-properties.loginTimeout=30
spring.datasource.hikari.data-source-properties.socketTimeout=120
# Valores por defecto de Hikari, explícitos (ms): espera de una petición por una conexión del pool; un solo intento de
# conexión al arrancar, acotado por loginTimeout (si falla, el arranque falla con la traza y Render mantiene la versión
# anterior); y keepalive de la conexión ociosa por debajo de los 5 minutos tras los que Neon se suspende.
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.keepalive-time=120000

# Modo realista (#199, ADR 0024): sin autenticación local. Solo se entra con Auth0, en la web y en la API; no hay inicio
# de sesión con contraseña, ni POST /api/auth/token, ni altas con contraseña (solo el alta por Auth0, #198). La
# contraseña local solo se comprueba una vez, al vincular la identidad de Auth0 de un cliente que ya existía. Exige las
# cinco variables APP_AUTH_AUTH0_* (RealisticModeCheck): sin alguna, la aplicación no arranca. Interruptor de
# emergencia: APP_AUTH_LOCAL=true en Render vuelve al modo local sin desplegar código.
app.auth.local=false
