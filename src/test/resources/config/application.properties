# Tests (#150): cada contexto de Spring tiene su propia base H2. Los datos ya no viven en los beans, así que dos
# contextos en caché sobre la misma base se verían los datos el uno al otro. Se suma a application.properties.
spring.datasource.url=jdbc:h2:mem:${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
