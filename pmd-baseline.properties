# Línea base de PMD (ADR 0020): code smells que ya existían el 2026-11-24, cuando entró el análisis en el build (#168).
# Siguen en el informe (./mvnw pmd:pmd), pero no hacen fallar el build; cualquier aviso nuevo, sí. Cada entrada se
# quita cuando su refactor la resuelve (ver docs/ia/pendientes.md). Formato: clase=Regla1,Regla2

# Servicio de aplicación que implementa los dos puertos de entrada (WMC 53, 35 tipos): separar commands y queries.
com.dawnrock.ddd.application.CheckingAccountService=GodClass,CouplingBetweenObjects
# Controlador web de todas las pantallas de cuentas (WMC 58, 27 tipos): un controlador por caso de uso.
com.dawnrock.ddd.adapter.in.web.AccountWebController=GodClass,CouplingBetweenObjects
# Agregado raíz (WMC 72): concentra las reglas a propósito; revisar si alguna regla es un objeto de valor propio.
# reconstitute (complejidad 15): comprobaciones estructurales al leer de la base (#150).
com.dawnrock.ddd.domain.model.CheckingAccount=GodClass,CyclomaticComplexity
# validate() de los commands de apertura y alta (complejidad 11): un validador por campo.
com.dawnrock.ddd.application.OpenAccountCommandDef=CyclomaticComplexity
com.dawnrock.ddd.application.SignUpCommandDef=CyclomaticComplexity
# Tests del servicio de aplicación (24 tipos): se repartirán con el servicio.
com.dawnrock.ddd.application.CheckingAccountServiceTests=CouplingBetweenObjects
