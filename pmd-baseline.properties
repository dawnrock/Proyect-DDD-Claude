# Línea base de PMD (ADR 0020): code smells que ya existían el 2026-11-24, cuando entró el análisis en el build (#168).
# No hacen fallar el build ni salen en el informe; ./mvnw pmd:pmd -Dpmd.baseline= los enseña. Cualquier aviso nuevo sí
# hace fallar el build. Cada entrada se quita cuando su refactor la resuelve (ver docs/ia/pendientes.md).
# Formato: clase=Regla1,Regla2. La línea base es por clase y regla, no por método.

# Agregado raíz (WMC 72): concentra las reglas a propósito; revisar si alguna regla es un objeto de valor propio.
# reconstitute (complejidad 15): comprobaciones estructurales al leer de la base (#150).
com.dawnrock.ddd.domain.model.CheckingAccount=GodClass,CyclomaticComplexity
# validate() de los commands de apertura y alta (complejidad 11): un validador por campo.
com.dawnrock.ddd.application.OpenAccountCommandDef=CyclomaticComplexity
com.dawnrock.ddd.application.SignUpCommandDef=CyclomaticComplexity
